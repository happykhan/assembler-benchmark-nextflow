[workspace]
name = "assembler-benchmark-nextflow"
version = "0.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
psutil = "==7.0.0"
minimap2 = "==2.31"

[feature.art20160605.dependencies]
art = "==2016.06.05"

[feature.skesa251.dependencies]
skesa = "==2.5.1"

[feature.flye296.dependencies]
flye = "==2.9.6"

[feature.raven183.dependencies]
raven-assembler = "==1.8.3"

[feature.plassembler190.dependencies]
plassembler = "==1.9.0"
flye = "==2.9.6"
raven-assembler = "==1.8.3"
unicycler = "==0.5.1"

[feature.miniasm03.dependencies]
miniasm = "==0.3"

[feature.minipolish021.dependencies]
minipolish = "==0.2.1"
miniasm = "==0.3"
racon = "==1.5.0"

[environments]
default = { features = [], solve-group = "tooling" }
art-2016-06-05 = { features = ["art20160605"], solve-group = "art20160605" }
skesa-2-5-1 = { features = ["skesa251"], solve-group = "skesa251" }
flye-2-9-6 = { features = ["flye296"], solve-group = "flye296" }
raven-1-8-3 = { features = ["raven183"], solve-group = "raven183" }
plassembler-1-9-0 = { features = ["plassembler190"], solve-group = "plassembler190" }
miniasm-0-3 = { features = ["miniasm03"], solve-group = "miniasm03" }
miniasm-plus-0-2-1 = { features = ["minipolish021"], solve-group = "minipolish021" }
